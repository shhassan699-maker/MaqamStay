name: Customer CI and isolated images
on:
  push:
    branches: [staging]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SITE_URL: https://maqamstay-staging.169-58-95-12.sslip.io
      NEXT_PUBLIC_WHATSAPP_NUMBER: "10000000000"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Verify pinned image toolchain
        run: test "$(node --version)" = "v24.21.0" && test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node deploy/verify-customer-crm.mjs
      - run: node deploy/verify-bundles.mjs
      - run: node --test deploy/customer-crm.test.mjs deploy/image-verification.test.mjs deploy/repository-verification.test.mjs
      - run: node --test deploy/cicd/*.test.mjs
      - run: node deploy/cicd/verify-source.mjs
      - name: Validate workflow and deployment shells
        run: bash deploy/cicd/validate.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build both images without server secrets
        run: |
          node -e "require('fs').writeFileSync('.env.image-ci','ci-only-canary-'+require('crypto').randomBytes(24).toString('hex'))"
          docker build -f deploy/Dockerfile --target runtime --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" --build-arg NEXT_PUBLIC_WHATSAPP_NUMBER="$NEXT_PUBLIC_WHATSAPP_NUMBER" -t local/customer:ci .
          docker build -f deploy/Dockerfile --target release -t local/customer-release:ci .
      - run: node deploy/verify-images.mjs local/customer:ci local/customer-release:ci
